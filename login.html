<!DOCTYPE html>
<html>
<head>
    <title>Login - Rosé Garden</title>
    <link rel="stylesheet" href="StyleSheet1.css">
</head>


<body class="login-page">
    <!-- Rubric: Navigation Menu and Linking Pages -->
    <nav>
        Menu
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html">Sign Up</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
    </nav>
    <h1>Login to Rosé Garden</h1>

    <form>
        <label>Username:</label>
        <input type="text" id="loginName">

        <br><br>

        <label>Password:</label>
        <input type="password" id="loginPassword">

        <br><br>

        <input type="button" value="Login" onclick="checkLogin()">
    </form>

    <script src="Script1.js"></script>
    <!-- Image Mapping - Login Page -->

    <h2>Discover Rosé Garden</h2>
    <p>Click on the flower image to learn more about us.</p>

    <img src="img/about_us-design.jpg"
         width="200" height="200"
         usemap="#loginMap"
         alt="Red Rose">

    <map name="loginMap">
        <area shape="rect"
              coords="0,0,200,200"
              href="about.html"
              alt="About Us">
    </map>
    <p>
        Don't have an account?
        <a href="signup.html">Sign Up here</a>
    </p>
</body>
</html>
