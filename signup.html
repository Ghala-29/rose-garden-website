<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Rosé Garden</title>
    <link rel="stylesheet" href="StyleSheet1.css">
</head>

<body class="signup-page">
    <!-- Rubric: Navigation Menu and Linking Pages -->
    <nav>
        Menu
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html">Sign Up</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
    </nav>
    <h1>Create Your Account</h1>
    <p>Join Rosé Garden today!</p>

    <!-- Rubric: HTML Form -->
    <form>
        <label>Full Name:</label>
        <input type="text" id="fullName">

        <br><br>

        <label>Email:</label>
        <input type="email" id="email">

        <br><br>

        <label>Password:</label>
        <input type="password" id="signupPassword">

        <br><br>

        <input type="button" value="Sign Up" onclick="checkSignup()">
        <input type="reset" value="Clear">
    </form>

    <script src="Script1.js"></script>
    <!-- Image Mapping - Sign Up Page -->

    <h2>Discover Rosé Garden</h2>
    <p>Click on the flower image to learn more about us.</p>

    <img src="img/about_us-design.jpg"
         width="200" height="200"
         usemap="#signupMap"
         alt="Pink Tulips">

    <map name="signupMap">
        <area shape="rect"
              coords="0,0,200,200"
              href="about.html"
              alt="About Us">
    </map>
</body>
</html>
